body{margin:0;background:#29211A}
a{color:#D3BE9C}a:hover{color:#EFE6D8}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400 !important}
.btn{appearance:none;border:1px solid #D3BE9C;background:#D3BE9C;color:#29211A;font:500 12px Jost,sans-serif;letter-spacing:.18em;text-transform:uppercase;border-radius:2px;min-height:48px;padding:0 20px;cursor:pointer}
.btn.off{background:transparent;border-color:#66574A;color:#B8A994;cursor:default}
.ghost{appearance:none;border:1px solid #66574A;background:transparent;color:#EFE6D8;font:500 11.5px Jost,sans-serif;letter-spacing:.12em;text-transform:uppercase;border-radius:2px;min-height:44px;padding:0 14px;cursor:pointer}
.seg{appearance:none;border:0;background:none;font:500 11px Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#B8A994;min-height:40px;padding:0 14px;border-radius:2px;cursor:pointer}
.seg.on{background:#D3BE9C;color:#29211A}
.lbl{font:500 10.5px Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#D3BE9C}
.muted{color:#B8A994}
input,textarea,select{color-scheme:dark}
input::placeholder,textarea::placeholder{color:#7D6F5E}

.chip{appearance:none;border:1px solid #66574A;background:transparent;color:#EFE6D8;font:400 14px Jost,sans-serif;border-radius:2px;min-height:44px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.chip.on{background:#D3BE9C;border-color:#D3BE9C;color:#29211A}
.tab{position:relative;appearance:none;border:0;background:none;font:500 9.5px Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8F8170;min-height:58px;flex:1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tab.on{color:#D3BE9C}
.seg{flex:1}
.navbtn{appearance:none;cursor:pointer;width:44px;height:44px;border-radius:2px;border:1px solid #66574A;background:transparent;color:#EFE6D8;display:flex;align-items:center;justify-content:center;flex:none}
.lbl{margin:0 0 10px}
.card{background:#30271F;border:1px solid #463B30;border-radius:3px;padding:18px}
.row{display:flex;justify-content:space-between;gap:12px;font:400 14px Jost,sans-serif;padding:10px 0;border-bottom:1px solid #463B30}
.irow{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid #463B30}
.irow:last-child{border-bottom:0}


/* Preserve the approved mobile geometry. Desktop expands only the outer shell. */
html,body{margin:0;min-height:100%;width:100%}
body{background:#29211a}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #d3be9c;outline-offset:3px}
.app-shell.client-shell,.app-shell.therapist-shell{width:100%!important;max-width:520px;height:100dvh!important;min-height:580px;margin:auto}
.app-shell>div{flex-shrink:0}.app-shell>[data-scroll]{flex-shrink:1;min-height:0;overscroll-behavior:contain}
.owner-shell button:focus-visible,.owner-shell input:focus-visible,.owner-shell select:focus-visible,.owner-shell textarea:focus-visible{outline-color:#111}
.owner-mobile-menu{display:none}
.preview-note{font:12px/1.5 system-ui,sans-serif;background:#f4f4f2;color:#333;padding:12px 18px;text-align:center;border-top:1px solid #ddd}
.preview-note a{color:#333}.preview-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:200;background:#fff;color:#111;border:1px solid #aaa;padding:16px 20px;max-width:calc(100vw - 32px);width:440px;box-shadow:0 5px 30px #0004;font:14px/1.5 system-ui,sans-serif}
.preview-toast button{float:right;background:none;border:0;color:#111;font-size:20px;min-width:44px;min-height:44px}
.local-form-overlay{position:fixed;inset:0;background:#0008;z-index:100;display:grid;place-items:center;padding:20px}
.local-form-overlay,.local-form-overlay *,.preview-toast{box-sizing:border-box}
.local-form-overlay>div{max-width:440px;width:100%;max-height:90dvh;overflow:auto;padding:24px;background:#30271f;color:#efe6d8;border:1px solid #66574a;display:grid;gap:16px;font-family:Jost,sans-serif}.local-form-overlay label{display:grid;gap:8px}.local-form-overlay input,.local-form-overlay textarea{width:100%;min-height:44px;background:transparent;color:inherit;border:1px solid #66574a;padding:10px;font:inherit}
@media(min-width:760px){.client-shell,.therapist-shell{border-left:1px solid #463b30;border-right:1px solid #463b30}}
@media(max-width:759px){.owner-mobile-menu{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:white;border-bottom:1px solid #e6e6e6;padding:10px 18px;font:12px 'Hanken Grotesk',sans-serif;letter-spacing:.2em}.owner-mobile-menu button{background:white;border:1px solid #111;min-height:44px;padding:0 16px;color:#111}.owner-shell{display:block!important}.owner-shell aside{display:none!important}.owner-shell.menu-open aside{display:flex!important;position:fixed;left:0;top:65px;bottom:0;width:232px!important;z-index:50;min-height:0;box-shadow:20px 0 40px #0002}.owner-content>div{padding:24px 18px!important}.owner-shell [style*="grid-template-columns: repeat(4"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}.owner-shell [style*="minmax(320px"],.owner-shell [style*="minmax(300px"]{grid-template-columns:minmax(0,1fr)!important}.owner-shell .card{padding:16px}.owner-shell .row{flex-wrap:wrap}.owner-shell .h2{font-size:26px}.owner-shell [style*="min-width: 240px"]{min-width:0!important}.owner-shell [style*="grid-template-columns: 1.5fr"],.owner-shell [style*="grid-template-columns: 1.8fr"]{min-width:840px}.owner-shell [style*="overflow-x: auto"]{max-width:100%}.owner-shell [data-screen="a2hOpen"]{padding:12px!important}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media(max-width:759px){.owner-shell [data-screen="isTher"]>div:first-child>div:last-child{flex-wrap:wrap}.owner-shell [data-screen="hpMode"]{flex-wrap:wrap}.owner-shell [data-screen="hpMode"]>div{flex-wrap:wrap}.owner-shell [data-screen="isTher"] [style*="justify-content: space-between"][style*="background: #111111"]{flex-wrap:wrap}}

.app-test-bar{font:11px Jost,sans-serif;background:#1e1813;color:#d3be9c;padding:7px 14px;display:flex;justify-content:space-between;gap:10px;min-height:24px;align-items:center}.app-test-bar button,.text-button{background:transparent;border:0;color:inherit;cursor:pointer;text-decoration:underline;min-height:32px;font:inherit}.app-shell.client-shell,.app-shell.therapist-shell{height:calc(100dvh - 38px)!important}.app-notice{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:300;width:min(440px,calc(100vw - 32px));box-sizing:border-box;padding:18px;background:#efe6d8;color:#29211a;border:1px solid #66574a;display:flex;align-items:center;gap:10px;font:15px/1.45 Jost,sans-serif;box-shadow:0 6px 24px #0006}.app-notice button{border:0;background:none;color:inherit;font-size:24px;min-width:32px;cursor:pointer}.app-auth,.app-loading{max-width:440px;margin:8vh auto;padding:24px;box-sizing:border-box;font:16px Jost,sans-serif;color:#efe6d8}.app-auth h1{font-size:38px}.app-auth form,.app-auth label{display:grid;gap:12px}.app-auth form{gap:22px;margin:26px 0}.app-auth input,.app-editor input,.app-editor textarea,.app-editor select{background:#30271f;color:#efe6d8;border:1px solid #66574a;border-radius:2px;padding:13px;font:16px Jost,sans-serif;box-sizing:border-box;width:100%}.app-auth a{color:#d3be9c}.app-editor{display:grid;gap:18px}.app-editor label{display:grid;gap:8px}.runtime-footer{padding:16px 22px;display:flex;gap:12px;border-top:1px solid #463b30}.runtime-empty{padding:22px;font:15px/1.5 Jost,sans-serif;color:#b8a994}.app-auth .btn{display:inline-flex;justify-content:center;align-items:center;text-decoration:none}.runtime-photo{width:68px;height:76px;object-fit:cover;border-radius:3px}.runtime-placeholder{width:68px;height:76px;background:#463b30;display:grid;place-items:center;border-radius:3px;font:32px 'Instrument Serif',serif}.owner-runtime{background:white;color:#111;min-height:100dvh;font-family:'Hanken Grotesk',sans-serif}.owner-runtime .app-test-bar{background:#f7f7f5;color:#111}.owner-runtime .app-auth{color:#111}.owner-runtime .app-auth input{background:white;color:#111;border-color:#ddd}.owner-runtime .btn{background:#111;color:#fff}.owner-runtime .text-button{color:#111}.owner-runtime .app-notice{background:white;color:#111}.owner-runtime td{border-bottom:1px solid #e6e6e6;padding:16px 8px}.owner-runtime th{text-align:left;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#888;padding:12px 8px}.owner-runtime .owner-table{width:100%;border-collapse:collapse;font-size:14px}.owner-runtime .empty{padding:38px;color:#777}.owner-runtime .review-field{white-space:pre-wrap;font-size:14px}.owner-runtime .card{margin-bottom:18px}.owner-runtime .card h2{margin-top:0}.owner-runtime button:disabled{opacity:.4;cursor:not-allowed}.owner-runtime .owner-scroll{overflow:auto}.app-shell button:disabled{cursor:not-allowed;opacity:.45}.app-editor input[type=file]{padding:8px}.app-editor input[type=checkbox]{width:auto}.app-runtime-lock{padding:16px 22px;color:#d3be9c;background:#30271f;font:13px/1.5 Jost,sans-serif}

body:has(.runtime-footer) .app-shell.client-shell,body:has(.runtime-footer) .app-shell.therapist-shell,body:has(.app-runtime-lock) .app-shell.client-shell{height:calc(100dvh - 110px)!important}.runtime-footer{box-sizing:border-box;min-height:72px;align-items:center;justify-content:center;color:#efe6d8}.runtime-footer .btn{min-height:40px}
/* Let the app fill the remaining viewport; avoid clipping controls on small phones. */
body:not(.owner-runtime) #root{height:100dvh;display:flex;flex-direction:column;min-height:0}
body:not(.owner-runtime) #root>.app-test-bar{flex:none}
body:not(.owner-runtime) #root>div:has(>.app-shell){display:flex;flex-direction:column;flex:1;min-height:0}
body:not(.owner-runtime) #root .app-shell{height:auto!important;min-height:0!important;flex:1}
.runtime-footer,.app-runtime-lock,.runtime-empty{flex:none;box-sizing:border-box;width:100%;max-width:520px;margin-inline:auto}
.runtime-footer{font:14px Jost,sans-serif;padding:10px 16px;min-height:60px;gap:10px}
